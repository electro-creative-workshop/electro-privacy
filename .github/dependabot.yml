version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: '05:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 1
    rebase-strategy: 'auto'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      all-dependencies:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
