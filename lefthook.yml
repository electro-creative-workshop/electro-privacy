pre-commit:
    parallel: false
    commands:
        # Use ESLint to fix issues with staged files
        lint:
            run: npx eslint --no-warn-ignored --fix {staged_files} && git add {staged_files}
        # Use prettier to fix issues with staged files
        beautify:
            run: npx prettier --ignore-unknown --write {staged_files} && git add {staged_files}

pre-push:
    jobs:
        - name: Build
          run: npm run build
